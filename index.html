<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Доска Позора</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <div class="scanlines"></div>

  <header>
    <div class="header-glow"></div>
    <div class="header-content">
      <div class="badge">⚠ LIVE</div>
      <h1 class="glitch" data-text="ДОСКА ПОЗОРА">ДОСКА ПОЗОРА</h1>
      <p class="subtitle">Каждый увидит. Никто не забудет.</p>
      <div class="header-line"></div>
    </div>
  </header>

  <main>
    <section class="add-form glass">
      <div class="section-header">
        <div class="section-icon">⚡</div>
        <h2>Новый понос</h2>
      </div>
      <form id="postForm">
        <div class="input-group">
          <input type="text" id="name" placeholder=" " required>
          <label>Имя / Нickname</label>
          <div class="input-glow"></div>
        </div>
        <div class="input-group">
          <textarea id="description" placeholder=" " required></textarea>
          <label>Описание проступка</label>
          <div class="input-glow"></div>
        </div>
        <label class="file-label">
          <input type="file" id="photo" accept="image/*">
          <span class="file-icon">📷</span>
          <span class="file-text">Выбрать фото</span>
          <div class="file-ripple"></div>
        </label>
        <img id="preview" class="preview hidden" alt="Превью">
        <button type="submit">
          <span class="btn-text">ОПОЗОРИТЬ</span>
          <span class="btn-icon">🔥</span>
          <div class="btn-glow"></div>
        </button>
      </form>
    </section>

    <section class="board">
      <div class="section-header">
        <div class="section-icon">🏆</div>
        <h2>Зал славы позора</h2>
      </div>
      <div id="posts" class="posts"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content glass">
      <button class="close-btn" id="closeModal">
        <span>&times;</span>
      </button>
      <div class="modal-img-wrapper">
        <img id="modalImg" alt="Фото">
      </div>
      <div class="modal-body">
        <h3 id="modalName"></h3>
        <p id="modalDesc"></p>
        <small id="modalDate"></small>
      </div>
    </div>
  </div>

  <script type="module" src="bg.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
